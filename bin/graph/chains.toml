  ]

  [[behavior.shape]]
  setting = "dokan_delivery_time.time_slot_minutes"
  via_chain = "delivery_time"
  effect = "slot granularity — each delivery day's open window is chopped into N-minute slots"
  anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:282"
  anchor_contains = "$delivery_settings['time_slot_minutes']"

  [[behavior.shape]]
  setting = "dokan_delivery_time.order_per_slot"
  via_chain = "delivery_time"
  effect = "per-slot capacity — a slot stops being offered once it already holds N orders; 0 = unlimited"
  anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:141"
  anchor_contains = "0 === (int) $vendor_order_per_slot"

  [[behavior.shape]]
  setting = "dokan_delivery_time.delivery_buffer_unit"
  via_chain = "delivery_time"
  effect = """
  earliest selectable date/slot — 'days' blocks the next preorder_date days outright;
