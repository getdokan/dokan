# -------------------------------------------------------------------------- behaviors
# The use-case layer. A chain answers "which value wins"; a behavior answers "what does a
# real person experience because of it" — the missing hop between a setting and its point.
# Worked example: dokan_delivery_time.selection_required has a read-radius of 2, near the
# bottom of the audit, yet it is the switch for "customers must pick a delivery slot before
# they can pay". Radius measures code; behaviors measure consequence. Both are needed.
#
# Hand-written for the same reason chains are: "this validation callback blocks checkout"
# is not derivable from an AST. Same trust contract too — every anchor (including each
# gate/shape and the outcome) is verified by check_anchors.py.
#
# Vocabulary:
#   gate   — a setting that turns the behavior on/off or mandatory/optional. `via_chain`
#            means the value resolves through that Source chain (so a vendor can override);
#            ABSENT via_chain on a behavior that HAS a chain is itself a fact worth reading:
#            the setting is admin-only and the vendor override does NOT apply to it.
#   shape  — a setting that parameterizes the behavior without gating it.
#   outcome— what a successful pass of the behavior persists.
#
# Rendered by impact.py: per-setting under USE CASES, or the full story via
# `impact.py <behavior-id>` / `impact.py --behaviors`.

[[behavior]]
id = "checkout.delivery_slot_selection"
label = "Customer picks a delivery date & time slot at checkout"
actor = "customer"
surface = "checkout — classic and block"
chain = "delivery_time"
anchor = "dokan-pro/modules/delivery-time/includes/Frontend.php:268"
anchor_contains = "validate_delivery_time_slot_args"
outcome = """
One row per vendor in {prefix}dokan_delivery_time (order_id, vendor_id, date, slot,
delivery_type) plus delivery meta on each suborder — the same table order_per_slot counts
against, so every selection consumes slot capacity.
"""
outcome_anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:206"
outcome_anchor_contains = "prefix . 'dokan_delivery_time',"
notes = """
The three-actor story this behavior encodes: admin enables Delivery Time and sets the
schedule (chain rank 2). If admin also switches on allow_vendor_override_settings, a vendor
who saves their own schedule takes over (rank 1 — see behavior
vendor_dashboard.delivery_schedule_override). Whichever Source wins is what the customer
sees; selection_required then decides whether they can skip it. Note selection_required is
NOT in the chain: a vendor can override the schedule but can never make selection optional —
that is admin's call alone.
"""

  [[behavior.gate]]
  question = "Does the delivery box appear for this vendor's items?"
  setting = "dokan_delivery_time.delivery_support"
  via_chain = "delivery_time"
  when = """
  The winning Source has delivery_support on — or the vendor has store pickup active.
  Vendors failing both are dropped from the box; if every vendor drops (or the cart is all
  virtual/downloadable), the box never renders and nothing downstream happens.
  """
  anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:814"
  anchor_contains = "'on' === $vendor_delivery_options['delivery_support']"
  also_anchors = [
    { anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:888", anchor_contains = "|| $is_delivery_time_active ) {" },
  ]

  [[behavior.gate]]
  question = "Is selecting a date & slot mandatory?"
  setting = "dokan_delivery_time.selection_required"
  when = """
  'on' (default): checkout refuses to place the order until every participating vendor
  group has a date + slot (+ pickup location when the type is store-pickup). 'off': the box
  still renders but the customer may skip it.
  """
  note = """
  Enforced only on the two checkout paths (classic + block). Orders created via REST or
  admin never hit this gate. Admin-only: not part of the delivery_time chain, so a vendor
  cannot loosen it.
  """
  anchor = "dokan-pro/modules/delivery-time/includes/Frontend.php:269"
  anchor_contains = "'selection_required', 'dokan_delivery_time', 'on' )"
  also_anchors = [
