  """
  anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:325"
  anchor_contains = "function get_earliest_delivery_datetime"

[[behavior]]
id = "vendor_dashboard.delivery_schedule_override"
label = "Vendor configures their own delivery schedule"
actor = "vendor"
surface = "vendor dashboard -> Settings -> Delivery Time"
chain = "delivery_time"
anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:104"
anchor_contains = "! Helper::vendor_can_override_settings()"
outcome = """
usermeta._dokan_vendor_delivery_time_settings (+ regenerated _dokan_vendor_delivery_time_slots)
— rank 1 of the delivery_time chain. From the first save with a delivery_day onward, the
vendor's schedule, not the admin's, is what checkout.delivery_slot_selection shows customers.
"""
outcome_anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:482"
outcome_anchor_contains = "_dokan_vendor_delivery_time_settings', $data"

  [[behavior.gate]]
  question = "May this vendor override the admin schedule at all?"
  setting = "dokan_delivery_time.allow_vendor_override_settings"
  when = """
  'on': Delivery Time appears in the vendor settings menu and full payloads save. 'off':
  menu entry hidden, settings page renders nothing, React route unregistered, and BOTH save
  paths (form + REST) silently discard everything except delivery_support.
  """
  anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:104"
  anchor_contains = "! Helper::vendor_can_override_settings()"
  also_anchors = [
    { anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:271", anchor_contains = "! Helper::vendor_can_override_settings()" },
  ]

[[behavior]]
id = "vendor_order.delivery_time_update"
label = "Vendor updates the delivery time on an existing order"
actor = "vendor"
surface = "vendor dashboard -> order details -> Delivery Time box"
chain = "delivery_time"
anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:633"
anchor_contains = "function save_vendor_delivery_time_box"
outcome = """
The order's row in {prefix}dokan_delivery_time is deleted and re-inserted with the new
date/slot/type (so capacity moves with it), order meta is rewritten, and
dokan_after_vendor_update_order_delivery_info (Vendor.php:665) triggers the
'Dokan Vendor Update Order Delivery Time' WC email to the order's CUSTOMER
(UpdateVendorOrderDeliveryTime.php:38, enabled by default).
"""
outcome_anchor = "dokan-pro/modules/delivery-time/includes/Helper.php:605"
outcome_anchor_contains = "delete( $wpdb->prefix . 'dokan_delivery_time'"

  [[behavior.gate]]
  question = "Does the Delivery Time box render on the vendor's order details page?"
  setting = "dokan_delivery_time.delivery_support"
  via_chain = "delivery_time"
  when = """
  The winning Source has delivery_support on, or store pickup is active for the vendor.
  Neither -> the box never renders and the order's delivery time is vendor-immutable.
  """
  anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:583"
  anchor_contains = "! $is_delivery_time_active && ! $is_store_pickup_active"

  [[behavior.shape]]
  setting = "dokan_delivery_time.order_per_slot"
  via_chain = "delivery_time"
  effect = "same per-slot capacity as checkout applies to the replacement slot the vendor picks"
  anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:591"
  anchor_contains = "isset( $vendor_delivery_options['order_per_slot'] )"

  [[behavior.shape]]
  setting = "dokan_delivery_time.preorder_date"
  via_chain = "delivery_time"
  effect = """
  blocks the next N days in the vendor-side picker. Days mode only: unlike checkout, this
  box has no hours-mode branch, so with delivery_buffer_unit = 'hours' the vendor picker
  blocks nothing while checkout does.
  """
  anchor = "dokan-pro/modules/delivery-time/includes/Vendor.php:592"
  anchor_contains = "$vendor_delivery_options['preorder_date'] > 0"


