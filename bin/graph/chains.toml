# Source chains — curated manifest for the settings graph overlay.
#
# A Source chain is the ordered set of Sources a config value resolves through, most
# specific first. Exactly one Source wins; values never merge. See CONTEXT.md and
# docs/adr/0005-source-chains-resolve-by-precedence.md.
#
# WHY THIS FILE IS HAND-WRITTEN
# Nine chains exist. Only `commission` has formal structure (AbstractStrategy + set_next())
# that a scanner could detect. The other eight are inline if-ladders with no shared base
# class, no naming convention, and six different Defer encodings between them. A scanner
# would find 1 of 9 while looking authoritative — the same silent-undercount failure that
# makes an impact-analysis answer worse than no answer. So: written by hand, reviewed by
# humans, anchors verified in CI by bin/graph/check_anchors.py.
#
# It also captures edges no scanner could reach at all. The subscription module writes into
# commission's vendor Source via $vendor->save_commission_settings() — a domain method, not
# a meta call. See [[chain.written_by]] under commission.
#
# MAINTAINING
# `anchor` is "<repo>/<path>:<line>". CI verifies the file exists and the line still
# contains `anchor_contains`. When an anchor drifts, fix it here — a stale anchor means the
# chain description is no longer trustworthy, and this file's only value is trustworthiness.
# When you add a chain #10, add it here; nothing will find it for you.

schema_version = 1


# ----------------------------------------------------------------------------- discrepancies
# Places where two mechanisms that should agree do not. The scanner detects one class on its
# own — grant_without_revoke, where saving a setting grants a capability nothing ever revokes,
# so "off" stops meaning off. These are the ones it cannot prove and a human has to assert.
#
# Each needs an anchor + anchor_contains like everything else here, so check_anchors.py fails
# when the code moves out from under the claim. A discrepancy that silently stops being true
# is worse than one never recorded: someone will "fix" a bug that no longer exists.
#
# Recorded, not fixed. Fixing them is a separate decision with separate blast radius.
#
# REMOVED 2026-07-15: `defer_predicates_disagree` (was severity=high). It claimed manual_order
# skips its subscription_pack Source for a vendor whose `_dokan_enable_manual_order` row EXISTS
# but holds ''. Both predicates were quoted correctly — Manager.php:83 tests '' === $capability,
# module.php:2535 tests metadata_exists() — but the state is UNREACHABLE: the only writer,
# Settings::save_enable_manual_order_for_vendor (Settings.php:131), runs every input through
# wc_bool_to_string() and can only ever emit 'yes' or 'no'. A discrepancy nobody can trigger is
# not a bug, and this file's whole argument is that a stale "this is broken" note is worse than
# none. It was found by adversarial review, not by the anchor check — anchors verify WHERE a
# claim points, never WHETHER it is true. Do not re-add without a reachable repro.

[[discrepancy]]
type = "two_paths_one_question"
severity = "medium"
chain = "manual_order"
setting = "dokan_selling.allow_vendor_create_manual_order"
anchor = "dokan-pro/includes/Dashboard/ManualOrders/Settings.php:169"
anchor_contains = "$is_enable = dokan_pro()->manual_orders->is_enabled_globally();"
summary = """
Two code paths answer "can this vendor create manual orders" and only one walks the whole
chain. Manager::is_enabled_for_vendor() (Manager.php:72) resolves vendor -> pack -> global via
the dokan_manual_orders_is_enabled filter. Settings::add_manual_order_capability_to_vendor_shop_data()
(Settings.php:168) re-implements vendor + global INLINE and fires a different filter
(dokan_vendor_enable_manual_order) that has no subscribers — so the pack Source never applies
there. A vendor on a pack granting manual orders reads enabled via Manager and disabled via
the store REST payload.
"""

[[discrepancy]]
type = "filter_return_discarded"
severity = "medium"
chain = "commission"
setting = "postmeta._per_product_admin_commission"
anchor = "dokan-lite/includes/Commission/Settings/Product.php:69"
anchor_contains = "dokan_product_commission_settings_before_save"
summary = """
Product.php:69 assigns apply_filters(...) to $settings (plural) then persists from $setting
(singular) — so the dokan_product_commission_settings_before_save filter's return value is
never saved. The filtered value IS passed to the after-save action, so a third party
modifying a product's commission sees their change reported back as applied while the
unfiltered value is written. The three sibling savers (Vendor.php:91, OrderItem.php:80,
GlobalSetting.php:80) all assign back to $setting correctly — this is a one-character typo in
1 of 4, not a convention.
"""


# ---------------------------------------------------------------------------------- labels
# Node `id` is the physical address — a fact, extracted, never editorialised. Node `label` is
# the canonical domain term. That split is what lets the graph be honest AND readable at once:
# CONTEXT.md tells us to avoid "commission type" and "rate", but the db keys really ARE
# commission_type and _dokan_commission_rate. The glossary governs prose and labels; it does
# not get to rename a legacy column.
#
# Only settings whose canonical term differs from their key need an entry. Everything else
# falls back to the field id.

[labels]
"dokan_selling.commission_type" = "Commission formula (global)"
"dokan_selling.admin_percentage" = "Commission percentage (global)"
"dokan_selling.additional_fee" = "Commission flat fee (global)"
"dokan_selling.commission_category_based_values" = "Category-based Commission formula (global)"
"dokan_selling.shipping_fee_recipient" = "Fee recipient: shipping"
"dokan_selling.tax_fee_recipient" = "Fee recipient: tax"
"dokan_selling.shipping_tax_fee_recipient" = "Fee recipient: shipping tax"
"dokan_withdraw.withdraw_date_limit" = "Withdraw threshold (global)"

"usermeta.dokan_admin_percentage" = "Commission percentage (vendor)"
"usermeta.dokan_admin_percentage_type" = "Commission formula (vendor)"
"usermeta.dokan_admin_additional_fee" = "Commission flat fee (vendor)"
"usermeta.admin_category_commission" = "Category-based Commission (vendor)"
"usermeta.withdraw_date_limit" = "Withdraw threshold (vendor)"

"postmeta._per_product_admin_commission" = "Commission percentage (product)"
"postmeta._per_product_admin_commission_type" = "Commission formula (product)"
"postmeta._per_product_admin_additional_fee" = "Commission flat fee (product)"

"itemmeta._dokan_commission_rate" = "Commission percentage (order item)"
"itemmeta._dokan_commission_type" = "Commission formula (order item)"
"itemmeta._dokan_additional_fee" = "Commission flat fee (order item)"
"itemmeta._dokan_commission_source" = "Winning Source (order item)"


# ---------------------------------------------------------------------------- commission
# The only formally-structured chain, and the deepest. Also the only one with a persisted
# record of which Source won: _dokan_commission_source. That field is where the domain term
# "Source" comes from.

[[chain]]
id = "commission"
label = "Commission"
repo = "dokan-lite"
resolver = "dokan-lite/includes/Commission/Strategies/AbstractStrategy.php:55"
anchor_contains = "get_eligible_strategy():"
defer_predicate = "trim( $percentage ) === '' && trim( $flat ) === ''"
defer_anchor = "dokan-lite/includes/Commission/Model/Setting.php:289"
source_meta = "_dokan_commission_source"
notes = """
Resolution freezes on first calculate(), not at order creation: AbstractStrategy
::save_settings_to_order_item() (:100) stamps the winning Source onto item meta, after
which rank 1 is always applicable and the chain never re-walks. Called from exactly one
place — OrderLineItemCommission.php:127 — which means any read path that calculates also
writes.

Category-based is resolved WITHIN ranks 3 and 4, not as its own Source: both branch on
type === 'category_based' and pick ['items'][cat] falling back to ['all'].

Variations resolve to their parent product (Settings/Product.php:22) — there is no
per-variation commission.
"""

  [[chain.level]]
  rank = 1
  source = "order_item"
  store = "itemmeta._dokan_commission_rate"
  also = [
    "itemmeta._dokan_commission_type",
    "itemmeta._dokan_additional_fee",
    "itemmeta._dokan_commission_source",
    "itemmeta._dokan_commission_meta",
  ]
  defer = "trim() === ''"
  anchor = "dokan-lite/includes/Commission/Settings/OrderItem.php:43"
  anchor_contains = "_dokan_commission_rate', t"

  [[chain.level]]
  rank = 2
  source = "product"
  store = "postmeta._per_product_admin_commission"
  also = [
    "postmeta._per_product_admin_commission_type",
    "postmeta._per_product_admin_additional_fee",
  ]
  defer = "trim() === ''"
  anchor = "dokan-lite/includes/Commission/Settings/Product.php:41"
  anchor_contains = "_per_product_admin_commission', t"

  [[chain.level]]
  rank = 3
  source = "vendor"
  store = "usermeta.dokan_admin_percentage"
  also = [
    "usermeta.dokan_admin_percentage_type",
    "usermeta.dokan_admin_additional_fee",
    "usermeta.admin_category_commission",
  ]
  defer = "trim() === ''"
  anchor = "dokan-lite/includes/Commission/Settings/Vendor.php:39"
  anchor_contains = "dokan_admin_percentage', t"

  [[chain.level]]
  rank = 4
  source = "global"
  setting = "dokan_selling.admin_percentage"
  also_settings = [
    "dokan_selling.commission_type",
    "dokan_selling.additional_fee",
    "dokan_selling.commission_category_based_values",
  ]
  defer = "dokan_get_option default of '' is falsy-empty"
  anchor = "dokan-lite/includes/Commission/Settings/GlobalSetting.php:37"
  anchor_contains = "admin_percentage',"
  notes = """
  commission_type is never genuinely empty at read time on the admin UI path:
  Admin/Settings.php:76 filters dokan_get_settings_values to default it to 'fixed'.
  """

  [[chain.level]]
  rank = 5
  source = "default"
  store = ""
  defer = "terminal — never defers"
  anchor = "dokan-lite/includes/Commission/Strategies/DefaultStrategy.php:48"
  anchor_contains = "set_flat"
  notes = "Forces flat=0/percentage=0 and returns null from get_next(), terminating."

  # Not a Source. The subscription module resolves its own snapshot then MATERIALIZES the
  # result into rank 3's store, so a subscription silently rewrites a vendor's commission
  # without joining this chain. Invisible to any scanner: it calls a domain method, not a
  # meta API. This is the single most important hand-declared edge in this file.
  [[chain.written_by]]
  store = "usermeta.dokan_admin_percentage"
  via = "$vendor->save_commission_settings()"
  anchor = "dokan-pro/modules/subscription/module.php:1121"
  anchor_contains = "save_commission_settings"
  chain_ref = "subscription_snapshot"


# ------------------------------------------------------------------------- manual_order
# Precedence is built by seed-then-overwrite rather than first-applicable, and rank 2 is
# spliced in by a filter from a different module. Structurally inverted from commission.

[[chain]]
id = "manual_order"
label = "Manual order capability"
repo = "dokan-pro"
resolver = "dokan-pro/includes/Dashboard/ManualOrders/Manager.php:98"
anchor_contains = "dokan_manual_orders_is_enabled"
defer_predicate = "'' === $capability   (Manager)   BUT   metadata_exists( 'user', ... )   (subscription) — see notes, these disagree"
notes = """
Seed-then-override, not first-applicable: Manager::is_enabled() resolves vendor-or-global
first, then the dokan_manual_orders_is_enabled filter lets the subscription pack override —
but only when the vendor Defers. Net precedence is still vendor > pack > global.

TWO FILTERS EXIST AND ONLY ONE IS A CHAIN. Do not confuse them:
  - dokan_manual_orders_is_enabled     Manager.php:98   — the real capability check. THIS one.
  - dokan_vendor_enable_manual_order   Settings.php:184 — builds the store REST payload,
    duplicating rank 1 + rank 3 inline (Settings.php:169-172). ZERO subscribers, so the pack
    Source does NOT apply on that path. A vendor on a pack that grants manual orders reads
    as enabled via Manager and as disabled via shop_data.

DEFER SIGNALS DISAGREE WITHIN THIS CHAIN — a latent bug, recorded not fixed:
  - Manager.php:83        Defers on '' === $capability          (empty value)
  - module.php:2534       Defers on metadata_exists( 'user' )   (row exists)
A vendor whose meta row exists but holds '' expressed no preference. Manager correctly falls
back to global; the subscription callback then sees metadata_exists() === true, concludes the
vendor already decided, and SKIPS the pack Source. So an empty-but-present vendor row
silently disables pack-granted manual orders.

NOT A SOURCE: modules/vendor-staff/module.php:490 also subscribes, but it is an AND-gate
($is_enabled && $vendor_id matches && $staff_user->has_cap('dokan_manage_manual_order')).
It can only narrow the answer to off, never supply a value. Gates are not precedence.
"""

  [[chain.level]]
  rank = 1
  source = "vendor"
  store = "usermeta._dokan_enable_manual_order"
  defer = "'' === capability"
  anchor = "dokan-pro/includes/Dashboard/ManualOrders/Manager.php:83"
  anchor_contains = "'' !== $capability"
  notes = "Meta key comes from Settings::get_meta_key(), not a literal — invisible to a key scan."

  [[chain.level]]
  rank = 2
  source = "subscription_pack"
  store = "postmeta._dokan_enable_manual_order"
  defer = "metadata_exists(user) || enable_pricing off || no package || ! product->meta_exists()"
  anchor = "dokan-pro/modules/subscription/module.php:2531"
  anchor_contains = "is_manual_order_enabled("
  gate_setting = "dokan_product_subscription.enable_pricing"
  notes = """
  Spliced in via dokan_manual_orders_is_enabled (registered module.php:178). Gated on
  dokan_product_subscription.enable_pricing — a setting from an unrelated section that can
  disable this entire Source. The pack value lives on the product_pack product, written at
  Settings.php:154; the field is the 'Enable Order Creation' checkbox (Settings.php:106).
  """

  [[chain.level]]
  rank = 3
  source = "global"
  setting = "dokan_selling.allow_vendor_create_manual_order"
  defer = "terminal — defaults to 'off'"
  anchor = "dokan-pro/includes/Dashboard/ManualOrders/Manager.php:109"
  anchor_contains = "allow_vendor_create_manual_order"


