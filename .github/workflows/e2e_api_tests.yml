name: E2E_API Tests

on:
    # workflow will run daily at 8:00 AM BDT (2:00 AM UTC)
    schedule:
        - cron: 0 2 * * *
    # workflow will trigger on pull request
    pull_request:
        branches: [develop]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - '**/*.txt'
    # workflow will trigger on push to develop branch
    push:
        branches: [develop]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - '**/*.txt'

    # workflow can be manually triggered
    workflow_dispatch:
        inputs:
            testsuite:
                description: Choose which test suite to run
                default: All
                type: choice
                options:
                    - E2E
                    - API
                    - All

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# workflow permissions
permissions:
    checks: write
    contents: write
    issues: write
    pull-requests: write

# workflow environment variables
env:
    ADMIN: admin
    ADMIN_PASSWORD: password
    VENDOR: vendor1
    VENDOR2: vendor2
    CUSTOMER: customer1
    CUSTOMER2: customer2
    USER_PASSWORD: 01dokan01
    GMAP: ${{secrets.GMAP}}
    MAPBOX: ${{secrets.MAPBOX}}
    BASE_URL: http://localhost:9999
    CI: true
    HEADLESS: true
    FORCE_COLOR: 1
    DB_HOST_NAME: localhost
    DB_USER_NAME: root
    DB_USER_PASSWORD: password
    DB_PORT: 9998
    DATABASE: tests-wordpress
    DB_PREFIX: wp
    PR_NUMBER: ${{ github.event.number }}
    SHA: ${{ github.event.pull_request.head.sha }}
    SYSTEM_INFO: ./tests/pw/playwright/systemInfo.json
    API_TEST_RESULT: ./tests/pw/playwright-report/api/summary-report/results.json
    E2E_TEST_RESULT: ./tests/pw/playwright-report/e2e/summary-report/results.json
    API_COVERAGE: ./tests/pw/playwright-report/api/coverage-report/coverage.json
    E2E_COVERAGE: ./tests/pw/playwright-report/e2e/coverage-report/coverage.json

jobs:
    # ─────────────────────────────────────────────────────────────────────────────
    # BUILD JOB — runs once, uploads compiled assets as an artifact so every test
    # runner downloads them instead of rebuilding from scratch.
    # Saves: ~5–10 min of webpack + composer time per test runner (×4 runners).
    # ─────────────────────────────────────────────────────────────────────────────
    build:
        name: Build plugin assets
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Needed so wp-env can reference the plugin by its "dokan-lite" slug
            - name: Expose repo as dokan-lite
              run: ln -s . dokan-lite

            # Checkout Dokan Pro (same-repo only; skip on fork PRs where secrets are unavailable)
            - name: Checkout Dokan Pro
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/checkout@v4
              with:
                  repository: getdokan/dokan-pro
                  ref: test_utils
                  path: dokan-pro
                  token: ${{ secrets.DOKAN_PRO_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # Cache Composer vendor directory — keyed on composer.lock so it only
            # invalidates when dependencies actually change.
            - name: Cache Composer dependencies (Dokan-lite)
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Composer install (Dokan-lite)
              run: |
                  composer i || composer update
                  composer i --no-dev -o || composer update --no-dev -o

            - name: Npm install & build (Dokan-lite)
              run: |
                  npm ci || npm i
                  npm run build

            # Build Dokan Pro (after clone; required before wp-env so plugin is ready)
            - name: Cache Composer dependencies (Dokan-pro)
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/cache@v4
              with:
                  path: dokan-pro/vendor
                  key: ${{ runner.os }}-composer-pro-${{ hashFiles('dokan-pro/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-pro-

            - name: Build Dokan Pro
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              run: |
                  cd dokan-pro
                  composer i --no-dev -o
                  npm ci || npm i
                  npm run build

            # Upload compiled output — test runners download this instead of rebuilding
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: plugin-build
                  path: |
                      vendor
                      assets
                      dokan-pro/vendor
                      dokan-pro/assets
                  if-no-files-found: ignore
                  retention-days: 1

    # ─────────────────────────────────────────────────────────────────────────────
    # TESTS JOB — single unified matrix that covers both E2E shards and API tests.
    # All 4 runners (3 e2e + 1 api) share the same job definition; each downloads
    # the pre-built artifact instead of compiling assets again.
    # ─────────────────────────────────────────────────────────────────────────────
    tests:
        name: ${{ matrix.suite }} (${{ matrix.shardIndex }}, ${{ matrix.shardTotal }})
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: e2e
                      shardIndex: 1
                      shardTotal: 3
                    - suite: e2e
                      shardIndex: 2
                      shardTotal: 3
                    - suite: e2e
                      shardIndex: 3
                      shardTotal: 3
                    - suite: api
                      shardIndex: 1
                      shardTotal: 1

        steps:
            - name: Checkout testing repo
              id: clone-dokan-lite
              uses: actions/checkout@v4

            # Expose repo as dokan-lite so wp-env activates "dokan-lite" (dokan-pro expects that slug)
            - name: Prepare dokan-lite folder
              run: ln -s . dokan-lite

            # Checkout Dokan Pro (same-repo only; skip on fork PRs where secrets are unavailable)
            - name: Checkout Dokan Pro
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/checkout@v4
              with:
                  repository: getdokan/dokan-pro
                  ref: test_utils
                  path: dokan-pro
                  token: ${{ secrets.DOKAN_PRO_TOKEN }}

            # Use desired version of NodeJS
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # Install test dependencies (Playwright, wp-env, etc.)
            - name: Install test dependencies
              working-directory: tests/pw
              run: npm ci || npm i

            # Restore pre-built vendor/ and assets/ — skips composer + webpack entirely.
            # Explicit path: ${{ github.workspace }} avoids v4 creating a plugin-build/ subdirectory.
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: plugin-build
                  path: ${{ github.workspace }}

            # Create wp debuglog file
            - name: Create wp debuglog file
              id: debug-log
              working-directory: tests/pw
              run: mkdir -p wp-data && touch wp-data/debug.log

            # Use CI config (../../dokan-pro) when dokan-pro present; lite-only when not (e.g. fork PR)
            - name: Prepare wp-env config
              working-directory: tests/pw
              run: |
                  if [ -d "../../dokan-pro" ]; then
                    echo "Dokan Pro present, using .wp-env.ci.json (../../dokan-pro)"
                    cp .wp-env.ci.json .wp-env.override.json
                  else
                    echo "Dokan Pro not present, using lite-only wp-env config"
                    cp .wp-env.json .wp-env.override.json
                  fi

            # Start wordpress environment
            - name: Start WordPress Env
              id: wp-env
              uses: nick-fields/retry@v3
              with:
                  timeout_minutes: 5
                  max_attempts: 2
                  retry_on: error
                  command: |
                      cd tests/pw
                      npm run start:env

            # Get Playwright version
            - name: Get installed Playwright version
              id: playwright-version
              working-directory: tests/pw
              run: |
                  echo "PLAYWRIGHT_VERSION=$(npm ls @playwright/test --json | jq --raw-output '.dependencies["@playwright/test"].version')" >> "$GITHUB_ENV"

            # Cache browser binaries, cache key is based on Playwright version and OS
            - name: Cache Playwright binaries
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
                  restore-keys: ${{ runner.os }}-playwright-

            # Install browser binaries & OS dependencies if cache missed
            - name: Install Playwright browser + OS dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              working-directory: tests/pw
              run: npx playwright install --with-deps chromium

            # Install only OS dependencies when browser binaries are already cached
            - name: Install Playwright OS dependencies (cache hit)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              working-directory: tests/pw
              run: npx playwright install-deps chromium

            # Run docker setup (auth + env setup)
            - name: Run docker setup
              working-directory: tests/pw
              run: npm run docker:setup

            # ── E2E tests ───────────────────────────────────────────────────────
            - name: 🧪 Run e2e tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
              id: e2e-test
              if: |
                  matrix.suite == 'e2e' &&
                  steps.wp-env.outcome == 'success' &&
                  (github.event_name != 'workflow_dispatch' ||
                   github.event.inputs.testsuite == 'E2E' ||
                   github.event.inputs.testsuite == 'All')
              timeout-minutes: 20
              working-directory: tests/pw
              run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

            - name: 🧪 Run e2e coverage
              if: matrix.suite == 'e2e' && (steps.e2e-test.outcome == 'success' || steps.e2e-test.outcome == 'failure')
              working-directory: tests/pw
              run: npm run test:e2e:coverage

            # ── API tests ───────────────────────────────────────────────────────
            - name: 🧪 Run api tests
              id: api-test
              if: |
                  matrix.suite == 'api' &&
                  steps.wp-env.outcome == 'success' &&
                  (github.event_name != 'workflow_dispatch' ||
                   github.event.inputs.testsuite == 'API' ||
                   github.event.inputs.testsuite == 'All')
              timeout-minutes: 10
              working-directory: tests/pw
              run: npm run test:api

            # ── Shared post-test steps ──────────────────────────────────────────
            - name: Backup Database
              if: always() && steps.wp-env.outcome == 'success'
              working-directory: tests/pw
              run: npm run wp-env run tests-cli wp db export wp-data/db.sql

            - name: Archive test artifacts (screenshots, HTML snapshots, Reports)
              if: always() && steps.debug-log.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: test-artifact-${{ matrix.suite }}-${{ matrix.shardIndex }}
                  path: |
                      tests/pw/wp-data
                      tests/pw/playwright
                      tests/pw/playwright-report
                  if-no-files-found: ignore
                  retention-days: 1

    # ─────────────────────────────────────────────────────────────────────────────
    # MERGE-REPORTS JOB — lightweight: no dokan-pro checkout, no composer, no build.
    # Only needs test deps to run the TypeScript merge utilities.
    # ─────────────────────────────────────────────────────────────────────────────
    merge-reports:
        if: ${{ !cancelled() }}
        needs: [tests]
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        # Artifact names changed: api runner → test-artifact-api-1
        env:
            SYSTEM_INFO: ./tests/pw/all-reports/test-artifact-api-1/playwright/systemInfo.json
            API_TEST_RESULT: ./tests/pw/all-reports/test-artifact-api-1/playwright-report/api/summary-report/results.json
            API_COVERAGE: ./tests/pw/all-reports/test-artifact-api-1/playwright-report/api/coverage-report/coverage.json
            E2E_TEST_RESULT: ./tests/pw/all-reports/merged-summary.json
            E2E_COVERAGE: ./tests/pw/all-reports/merged-coverage.json

        steps:
            - name: Checkout testing repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install test dependencies
              working-directory: tests/pw
              run: npm ci || npm i

            # Download all test artifacts from GitHub Actions
            - name: Download all test artifacts
              id: download-test-artifacts
              uses: actions/download-artifact@v4
              with:
                  path: tests/pw/all-reports
                  pattern: test-artifact-*

            # Move all blob report folder contents into a single folder
            - name: Move all blob report folder contents into a single folder
              working-directory: tests/pw/all-reports
              run: |
                  mkdir -p all-blob-reports
                  find . -type f -path "*/blob-report/*" -exec mv {} all-blob-reports/ \;

            # Generate HTML Report
            - name: Generate HTML Report
              id: generate-html-report
              working-directory: tests/pw
              run: |
                  npx playwright merge-reports --reporter html ./all-reports/all-blob-reports
                  mv playwright-report ./all-reports/html-report

            # Clean all extracted blob reports (except ZIPs)
            - name: Clean all extracted blob reports (except ZIPs)
              working-directory: tests/pw
              run: |
                  find all-reports/all-blob-reports -mindepth 1 ! -name "*.zip" -exec rm -rf {} +

            # Generate merged summary report
            - name: Generate merged summary report
              id: merge-summary-report
              if: steps.download-test-artifacts.outcome == 'success'
              working-directory: tests/pw
              run: REPORT_TYPE=e2e npx ts-node ./utils/mergeSummaryReport.ts

            # Generate merged coverage report
            - name: Generate merged coverage report
              if: steps.download-test-artifacts.outcome == 'success'
              working-directory: tests/pw
              run: REPORT_TYPE=e2e npx ts-node ./utils/mergeCoverageSummary.ts

            # Prepare test summary
            - name: Prepare test summary
              id: prepare-test-summary
              if: always() && steps.merge-summary-report.outcome == 'success'
              uses: actions/github-script@v7
              with:
                  result-encoding: string
                  script: |
                      const script = require("./tests/pw/utils/gitTestSummary.ts")
                      return await script({github, context, core})

            # Upload final test artifact
            - name: Upload final test artifact
              if: always() && steps.download-test-artifacts.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: final-test-artifact
                  path: tests/pw/all-reports
                  if-no-files-found: ignore
                  retention-days: 7
