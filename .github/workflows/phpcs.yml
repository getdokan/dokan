on:
  # Runs once a day only, to keep Actions cost down. Pull requests no longer
  # trigger this workflow -- it now inspects every PHP file committed to the
  # default branch in the last 24 hours.
  # workflow will run daily at 9:00 AM BDT (3:00 AM UTC)
  schedule:
    - cron: 0 3 * * *
  # workflow can be manually triggered
  workflow_dispatch:

# Cancels a previous run of this workflow that has not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: PHPCS Inspections
jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
      # Full history so the 24-hour git log window below can resolve commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 20
            cache: npm

      - name: Npm install and build
        run: |
            npm i
            npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: cs2pr, composer:v2

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress || composer update --prefer-dist --no-progress

      # PHP files touched by commits in the last 24 hours. Deleted files are
      # dropped by the -f existence test, same as the old pull-request check.
      - id: changes
        run: |
          FILES=$(git log --since='24 hours ago' --name-only --pretty=format: -- '*.php' \
            | sort -u \
            | while read -r f; do [ -n "$f" ] && [ -f "$f" ] && echo "$f"; done \
            | xargs)
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "PHP files changed in the last 24h: ${FILES:-none}" >> $GITHUB_STEP_SUMMARY

      - name: Detect coding standard violations
        if: steps.changes.outputs.files != ''
        run: vendor/bin/phpcs ${{ steps.changes.outputs.files }} -q --report=checkstyle | cs2pr --graceful-warnings

      - name: Start WordPress Environment
        run: |
            npm run env:start
      - name: Running the phpunit tests
        run: |
            npm run phpunit
